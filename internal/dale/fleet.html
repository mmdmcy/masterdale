        card("Machine", d.machine),
        card("Memory free", `${gb(d.memory_free_bytes)} of ${gb(d.memory_bytes)}; WSL holds ${gb(d.wsl_memory_bytes)}`),
        card("C:", `${gb(d.disk_c_free_bytes)} free of ${gb(d.disk_c_bytes)}`),
        card("Security", `Defender ${d.defender_on === false ? "off" : d.defender_on ? "on" : "unknown"}, firewall ${d.firewall_off.length ? "partly off" : "on"}`, d.defender_on === false || d.firewall_off.length ? "critical" : "ok"),
        card("Updates", d.restart_pending ? "restart pending" : "nothing waiting", d.restart_pending ? "warn" : "ok"),
        d.battery_percent != null ? card("Battery", `${d.battery_percent}%${d.on_power ? ", on power" : ""}`) : "",
        ...d.gpus.map((g) => card(g.name, `${g.temperature_c ?? "?"} °C, ${g.watts == null ? "?" : g.watts.toFixed(0)} W, ${g.power_state}, ${g.busy_percent ?? 0}% busy`, (g.temperature_c ?? 0) >= 85 ? "critical" : "ok")),
      ].join("");

        <div class="panel"><p><b>Most memory</b></p><ul>${list(d.heaviest.map(([n, b]) => `${esc(n)} <span class="muted">${gb(b)}</span>`))}</ul>
        <p><b>Starts with Windows</b> (${d.startup_programs.length})</p><ul>${list(d.startup_programs.map(esc))}</ul>
        <p><b>LinuxMice tasks</b></p><ul>${list(d.tasks.map(([t, s]) => `${esc(t)}: ${esc(s)}`))}</ul>
        <p class="muted">Read from inside the device's LinuxMice WSL distribution; nothing in Windows is changed. <code>lmice windows --device ${esc(d.device)}</code></p>
        <div class="toolbar"><button data-windows-space="${esc(d.device)}" type="button">What fills C:?</button><span class="muted" id="spaceMessage" role="status"></span></div><pre class="detail" id="spaceResult" hidden></pre></div>`;

    function renderCompareForm() {
      const devices = fleetDevices();
      const pick = (id, value) => `<select id="${id}">${devices.map((d) => `<option ${d === value ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>`;
      $("cards").innerHTML = "";
      $("meta").textContent = "";
      $("view").innerHTML = `<div class="panel"><div class="toolbar">${pick("cmpA", state.cmpA || devices[0] || "")}<span>with</span>${pick("cmpB", state.cmpB || devices[1] || devices[0] || "")}<button class="primary" id="cmpGo" type="button">Compare</button><span class="muted" id="cmpMessage" role="status"></span></div></div><div id="cmpResult"></div>`;
      $("cmpGo").addEventListener("click", runCompare);
      if (state.cmpResult) showCompare(state.cmpResult);
    }

    async function runCompare() {
      state.cmpA = $("cmpA").value; state.cmpB = $("cmpB").value;
      $("cmpMessage").textContent = "reading both machines…";
      try {
        const view = await api(`/v1/linuxmice/compare?a=${encodeURIComponent(state.cmpA)}&b=${encodeURIComponent(state.cmpB)}&refresh=1`);
        if (view.error) throw new Error(view.error);
        state.cmpResult = view.data; showCompare(view.data); $("cmpMessage").textContent = "";
      } catch (error) { $("cmpMessage").textContent = `failed: ${error.message}`; }
    }

    function showCompare(d) {
      const list = (items) => items.length ? items.slice(0, 40).map(esc).join(", ") + (items.length > 40 ? ` <span class="muted">+${items.length - 40} more</span>` : "") : `<span class="muted">none</span>`;
      $("cards").innerHTML = `<div class="card"><strong>${d.alike_pct}% alike</strong><span>${esc(d.a)} and ${esc(d.b)}</span></div><div class="card"><strong>${d.b_has_of_a_pct}%</strong><span>of ${esc(d.a)}'s things are on ${esc(d.b)}</span></div><div class="card"><strong>${d.a_has_of_b_pct}%</strong><span>of ${esc(d.b)}'s things are on ${esc(d.a)}</span></div>`;
      const rows = d.categories.map((c) => `<tr><td><b>${esc(c.category)}</b></td><td>${c.a_count}</td><td>${c.b_count}</td><td>${c.both}</td><td>${c.alike_pct}%</td></tr>`).join("");
      const details = d.categories.filter((c) => c.only_a.length || c.only_b.length || c.versions_differ.length).map((c) => `<div class="panel"><h3>${esc(c.category)}</h3><table><tbody>
        <tr><th>Only on ${esc(d.a)}</th><td>${list(c.only_a)}</td></tr>
        <tr><th>Only on ${esc(d.b)}</th><td>${list(c.only_b)}</td></tr>
        ${c.versions_differ.length ? `<tr><th>Other versions</th><td>${c.versions_differ.slice(0, 30).map(([n, a, b]) => `${esc(n)} <span class="muted">${esc(a)} vs ${esc(b)}</span>`).join("<br>")}</td></tr>` : ""}
      </tbody></table></div>`).join("");
      $("cmpResult").innerHTML = `<div class="scroll"><table><thead><tr><th>Category</th><th>${esc(d.a)}</th><th>${esc(d.b)}</th><th>Both</th><th>Alike</th></tr></thead><tbody>${rows}</tbody></table></div>${details}<div class="panel"><p><code>lmice inventory compare ${esc(d.a)} ${esc(d.b)}</code></p></div>`;
    }

    // Pages that belong to a module; they hide when it is off here.
    const MODULE_TABS = { workspace: ["repos", "folders", "move", "projects", "checkouts"], agents: ["agents"], org: ["org"], inventory: ["hardware", "compare"], servers: ["selfhost"], backups: ["backups"], https: ["https"], display: ["display"], windows: ["windows"], net: ["net"], vault: ["vault"], integrations: ["integrations"] };
    async function hideOffModules() {
      try {
        const view = await api("/v1/linuxmice/modules");
        for (const m of view.data?.modules || []) {
          for (const tab of MODULE_TABS[m.id] || []) {
            const b = document.querySelector(`[data-tab="${tab}"]`);
            if (b) b.hidden = !m.on;
          }
        }
      } catch (_) { /* an older lmice has no modules: show everything */ }
    }

      const rows = data.modules.map((m) => `<tr><td><b>${esc(m.id)}</b><br><span class="muted">${esc(m.name)}</span></td><td>${esc(m.about)}<br><span class="muted">${m.commands.map((c) => `lmice ${esc(c)}`).join(" · ")}${m.timer ? ` · timer lmice-${esc(m.timer)}` : ""}</span></td><td>${pill(m.on ? "ok" : "off")}</td><td><button data-module="${esc(m.id)}" data-module-on="${m.on ? "0" : "1"}" type="button" ${canChange ? "" : "disabled"}>${m.on ? "Switch off…" : "Switch on"}</button></td></tr>`).join("");

      const devices = data.devices.map((d) => `<div class="panel"><h3>${esc(d.name)}</h3><p>${esc(d.does)}</p><table><tbody>

        `<div class="panel"><p>A fresh machine becomes one of these from the device that holds the backup key: <code>lmice fleet rebuild NEW-MACHINE --as DEVICE</code>. Prove it first with <code>--drill</code> on a spare machine. Every night lawnmower captures what each machine runs and commits it (<code>lmice fleet schedule on</code>).</p></div>`;

    function renderHardware(data) {
      const gb = (b) => `${Math.round(b / 2 ** 30)} GB`;

          <tr><th>CPU</th><td>${esc(d.cpu)} · ${d.cores} cores, ${d.threads} threads${d.arch === "x86_64" ? (d.avx2 ? " · AVX2" : " · no AVX2") : ""}${d.cpu_watts != null ? ` · drawing ${d.cpu_watts} W now` : ""}</td></tr>
          <tr><th>Memory</th><td>${gb(d.memory_bytes)}${d.slots.length ? ` · ${used} of ${d.slots.length} slots used` : ""}${k ? ` <span class="muted">(${esc(k.memory)})</span>` : ""}</td></tr>

          <tr><th>GPU</th><td>${d.gpus.map(esc).join("<br>") || "—"}</td></tr>
          ${k ? `<tr><th>Power</th><td>about ${k.idle_watts} W idle, ${k.busy_watts} W busy</td></tr><tr><th>Local models</th><td>${esc(k.models)}</td></tr><tr><th>Upgrades</th><td>${k.upgrades.map(esc).join("<br>")}</td></tr>` : `<tr><th>Upgrades</th><td class="muted">No notes for ${esc(d.product)} yet.</td></tr>`}
        </tbody></table></div>`;

      const rows = data.rows.map((r) => `<tr><td><b>${esc(r.device || "could buy")}</b></td><td>${r.listing ? `<a href="${esc(r.listing)}" target="_blank" rel="noopener">${esc(r.name)}</a>` : esc(r.name)}${r.price_eur ? ` <span class="muted">about €${r.price_eur}</span>` : ""}</td><td>${r.idle_watts} W</td><td>€${r.yearly_eur}</td><td class="detail">${esc(r.models)}</td></tr>`).join("");
      $("view").innerHTML = `<div class="panel"><h3>Compared</h3><p class="muted">Running all year at idle, at €${data.price_per_kwh.toFixed(2)} per kWh. <code>lmice hardware compare --price 0.30</code></p></div>` +
        `<div class="scroll"><table><thead><tr><th>Device</th><th>Machine</th><th>Idle</th><th>Per year</th><th>Local models</th></tr></thead><tbody>${rows}</tbody></table></div>` + devices +
        `<div class="panel"><p><code>lmice hardware --fleet</code> · <code>lmice hardware compare</code></p></div>`;
    }

    function renderHttps(data) {
      const canChange = state.caps?.actions_enabled;
      $("cards").innerHTML = `<div class="card"><strong>${esc(data.host)}</strong><span>${esc(data.detail)}</span></div>` +
        `<div class="card"><strong>Certificate authority</strong><span>${data.ca_days_left == null ? "not created yet" : `valid ${esc(data.ca_days_left)} days · ${esc(data.ca_fingerprint.slice(0, 23))}…`}</span></div>` +
        `<div class="card"><strong>nginx</strong><span>${pill(data.nginx === "active" ? "ok" : data.nginx || "unknown")}</span></div>`;
      const rows = data.sites.map((s) => `<tr><td><b>${esc(s.name)}</b></td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></td><td class="detail">${esc(s.to)}</td><td>${pill(s.state === "ok" ? "ok" : "warn")} <span class="muted">${esc(s.detail)}</span></td><td><button data-https-remove="${esc(s.name)}" type="button" ${canChange ? "" : "disabled"}>Remove…</button></td></tr>`).join("");
      $("view").innerHTML = (rows ? `<div class="scroll"><table><thead><tr><th>Site</th><th>Address</th><th>Forwards to</th><th>State</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">No HTTPS sites yet.</div>`) +
        `<div class="panel"><h3>Serve another service</h3><form class="vault-form" id="httpsForm">
          <label>Name <input name="name" required pattern="[a-z][a-z0-9-]{0,31}" placeholder="dale"></label>
          <label>Port <input name="port" required type="number" min="1024" max="65535" placeholder="7443"></label>
          <label>Forwards to <input name="to" required placeholder="http://127.0.0.1:7345"></label>
          <div class="toolbar"><button class="primary" type="submit" ${canChange ? "" : "disabled"}>Add site</button><button data-https-apply type="button" ${canChange ? "" : "disabled"}>Renew and re-apply</button><span class="muted" id="httpsMessage" role="status"></span></div>
        </form></div>` +
        `<div class="panel"><h3>Set up a device to use these addresses</h3><div class="toolbar"><select id="httpsDevice">${fleetDevices().map((d) => `<option>${esc(d)}</option>`).join("")}</select><button data-https-setup="trust" type="button" ${canChange ? "" : "disabled"}>Trust the certificate authority…</button><button data-https-setup="names" type="button" ${canChange ? "" : "disabled"}>Add the names…</button></div></div>` +
        `<div class="panel"><p>Devices trust these addresses once they trust your certificate authority: <code>lmice https trust</code> on Linux; on the Mac and phones it asks for your password once. Names come from <code>lmice https names</code>. The certificate renews itself under 30 days left. <code>lmice https</code></p></div>`;
      $("httpsForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const f = new FormData(event.target);
        $("httpsMessage").textContent = "adding…";
        try { const job = await startJob({ kind: "https-add", id: f.get("name"), a: String(f.get("port")), b: f.get("to").trim() }); $("httpsMessage").textContent = job.state === "done" ? "added" : `failed: ${job.view.error || ""}`; } catch (error) { $("httpsMessage").textContent = `failed: ${error.message}`; }
        state.views.https = null; load(true);
      });
    }

    function renderOrg(data) {
      if (data.status === "none") {
        $("cards").innerHTML = "";
        $("view").innerHTML = `<div class="empty">${esc(data.detail)}</div>`;
        return;
      }
      const canChange = state.caps?.actions_enabled;
      const mark = { pass: "ok", fail: "failed", excepted: "exception", "n/a": "n/a", unknown: "unknown" };
      const lock = data.tailnet_lock == null ? "unknown" : data.tailnet_lock ? `${pill("ok")} on` : `${pill("warn")} off`;
      $("cards").innerHTML = `<div class="card"><strong>${esc(data.name)} ${pill(data.status === "ok" ? "ok" : "warn")}</strong><span>${esc(data.kind)} · ${esc(data.detail)}</span></div>` +
        `<div class="card"><strong>People</strong><span>${data.people.map((p) => `${esc(p.name)} (${esc(p.role)})`).join(", ")}</span></div>` +
        `<div class="card"><strong>Tailnet Lock</strong><span>${lock}${data.tailnet_lock === false ? " · <code>tailscale lock init</code> from a trusted device (recovery.md)" : ""}</span></div>`;
      const policies = data.policies.filter((p) => p !== "tailnet-lock");
      const rows = data.devices.map((d) => {
        const cells = policies.map((p) => {
          const c = d.checks.find((x) => x.policy === p);
          if (!c) return `<td class="muted">${d.status === "unreachable" ? "?" : "-"}</td>`;
          const button = c.fixable ? `<br><button data-fix="org-fix" data-id="${esc(p)}" data-device="${esc(d.name)}" data-label="Fix ${esc(p)}" data-title="${esc(d.name)}: ${esc(p)}" type="button" ${canChange ? "" : "disabled"}>Fix…</button>` : "";
          return `<td title="${esc(c.detail)}${c.fix ? ` · fix: ${esc(c.fix)}` : ""}">${pill(mark[c.state] || c.state)}${button}</td>`;
        }).join("");
        return `<tr><td><b>${esc(d.name)}</b><br><span class="muted">${esc(d.purpose || "")}${d.person ? ` · ${esc(d.person)}` : ""}</span></td>${cells}<td class="detail">${esc(d.detail)}</td></tr>`;
      }).join("");
      const notes = data.devices.flatMap((d) => d.checks.filter((c) => c.policy !== "tailnet-lock" && (c.state === "excepted" || c.state === "fail")).map((c) => `<tr><td>${esc(d.name)}</td><td>${pill(mark[c.state])} ${esc(c.policy)}</td><td class="detail">${esc(c.detail)}${c.fix ? `<br><code>${esc(c.fix)}</code>` : ""}</td></tr>`)).join("");
      const changes = state.views.changes?.data;
      if (!state.views.changes) api("/v1/linuxmice/changes").then((v) => { state.views.changes = v; if (state.tab === "org") render(); }).catch(() => {});
      const when = (t) => new Date(t * 1000).toLocaleString();
      const changeRows = (changes?.changes || []).map((c) => `<tr><td class="muted">${esc(when(c.at))}</td><td>${esc(c.device)}</td><td>${c.outcome === "failure" ? pill("failed") + " " : ""}${esc((c.change || c.command || c.action).replace(/\?$/, ""))}${c.error ? `<br><span class="muted">${esc(c.error)}</span>` : ""}</td><td class="muted">${esc(c.via || "")}${c.user ? ` · ${esc(c.user)}` : ""}</td></tr>`).join("");
      const logs = (changes?.devices || []).filter((d) => d.status === "broken").map((d) => `<p>${pill("critical")} the change log on ${esc(d.device)} was altered: ${esc(d.detail)}</p>`).join("");
      $("view").innerHTML =
        `<div class="scroll"><table><thead><tr><th>Device</th>${policies.map((p) => `<th>${esc(p)}</th>`).join("")}<th></th></tr></thead><tbody>${rows}</tbody></table></div>` +
        (notes ? `<h3>Exceptions and failures</h3><div class="scroll"><table><tbody>${notes}</tbody></table></div>` : "") +
        (data.access && data.access.status !== "none" ? `<h3>Who can sign in</h3><p>${pill(data.access.status === "ok" ? "ok" : data.access.status === "warn" ? "warn" : "unknown")} ${esc(data.access.detail)}</p>` +
          (data.access.accounts.length ? `<div class="scroll"><table><thead><tr><th>Account</th><th>Person</th><th>Rights</th><th>Last sign-in</th></tr></thead><tbody>${data.access.accounts.map((a) => `<tr><td>${esc(a.email)}</td><td>${a.person ? esc(a.person) : pill("warn") + " unknown"}</td><td>${a.admin ? "admin" : "member"}${a.enabled ? "" : " · disabled"}</td><td class="muted">${esc(a.last_login ? new Date(a.last_login).toLocaleString() : "never")}</td></tr>`).join("")}</tbody></table></div>` : "") +
          (data.access.recent.length ? `<details><summary>Sign-in events this week (${data.access.recent.length})</summary><div class="scroll"><table><tbody>${data.access.recent.map((e) => `<tr><td class="muted">${esc(new Date(e.at).toLocaleString())}</td><td>${pill(e.outcome === "success" ? "ok" : e.outcome === "denied" ? "failed" : e.outcome)} ${esc(e.event)}</td><td>${esc(e.email || "-")}</td><td class="muted">${esc(e.source_ip || "")}</td></tr>`).join("")}</tbody></table></div></details>` : "") : "") +
        `<h3>Changes</h3>${logs}` + (changes ? (changeRows ? `<div class="scroll"><table><thead><tr><th>When</th><th>Device</th><th>Change</th><th>By</th></tr></thead><tbody>${changeRows}</tbody></table></div>` : `<div class="empty">No changes recorded yet.</div>`) : `<p class="muted">loading the change log…</p>`) +
        `<div class="panel"><p>The organization file is <code>${esc(data.file)}</code>: people, devices, the policies every device meets and the exceptions with their reasons. Every change made through LinuxMice is recorded on the device that made it, chained by hash so an edited record shows. <code>lmice org</code> · <code>lmice changes</code></p></div>`;

    function renderRescue(data) {
      $("cards").innerHTML = `<div class="card"><strong>${esc(state.caps?.device || "this node")} ${pill(data.summary.state)}</strong><span>${data.summary.ok} ok · ${data.summary.warnings} warnings · ${data.summary.critical} critical · ${data.summary.unknown} unknown</span></div>`;
      const group = (title, checks) => `<h3>${esc(title)}</h3><div class="scroll"><table><tbody>${checks.map((c) => `<tr><td>${pill(c.state)}</td><td>${esc(c.label)}</td><td class="detail">${esc(c.detail)}</td></tr>`).join("")}</tbody></table></div>`;

        `<h3>Source survival</h3><p>${pill(s.state)} ${s.total_repositories} repos · ${s.cloud_remote_repositories} on a cloud remote · ${s.local_or_forge_repositories} local/forge only · ${s.repositories_without_remotes} without a remote</p>` +
        (data.recommendations.length ? `<h3>Recommendations</h3><ul>${data.recommendations.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "") +
        `<p class="muted">Health covers the node this page runs on (${esc(state.caps?.device || "")}). Its checks assume a Linux server with systemd; on macOS most of them read "unknown".</p>`;

    function openDiff(location) {
      const devices = (state.views.map?.data?.devices || []).filter((d) => d.collected).map((d) => d.device);
      if (devices.length < 2) return;
      state.location = location;
      const local = state.views.map.data.local_device;
      const first = devices.includes(local) ? local : devices[0];
      const second = devices.find((d) => d !== first);
      $("diffA").innerHTML = devices.map((d) => `<option ${d === first ? "selected" : ""}>${esc(d)}</option>`).join("");
      $("diffB").innerHTML = devices.map((d) => `<option ${d === second ? "selected" : ""}>${esc(d)}</option>`).join("");
      $("diffPatch").checked = false;
      $("diffTitle").textContent = location;
      $("diffBody").innerHTML = "";
      $("diffDialog").showModal();
      runDiff();
    }
    async function runDiff() {
      const a = $("diffA").value, b = $("diffB").value;
      if (a === b) { $("diffBody").innerHTML = `<div class="empty">Pick two different devices.</div>`; return; }
      $("diffBody").innerHTML = `<div class="empty">comparing ${esc(a)} and ${esc(b)}…</div>`;
      try {
        const patch = $("diffPatch").checked ? "&patch=1" : "";
        const view = await api(`/v1/linuxmice/diff?location=${encodeURIComponent(state.location)}&a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}${patch}`);
        $("diffBody").innerHTML = `<div class="meta">${meta(view)}</div>` + (view.data ? renderDiff(view.data) : `<div class="empty">${esc(view.error || view.hint)}</div>`);
      } catch (error) {
        $("diffBody").innerHTML = `<div class="empty">failed: ${esc(error.message)}</div>`;
      }
    }
    function renderDiff(d) {
      let html = `<p>${pill(d.relation.code)} ${esc(d.relation.detail)}</p>`;
      if (d.repository) {
        html += d.repository.sides.map((s) => `<h3>${esc(s.device)}</h3>` + (!s.present ? `<p class="muted">not present</p>` :
          `<p class="mono">${esc(s.path || "")} · ${esc(s.branch || "detached")} ${esc((s.head || "").slice(0, 10))}${s.upstream ? ` · ${esc(s.upstream)} +${s.upstream_ahead}/-${s.upstream_behind}` : ""}</p>` +
          (s.commits_only_here?.length ? `<p><strong>${s.commits_only_here_count} commit(s) only here</strong></p><pre class="mono">${s.commits_only_here.map((c) => `${esc(c.id.slice(0, 10))} ${esc(c.subject)}`).join("\n")}</pre>` : "") +
          (s.dirty_files?.length ? `<p><strong>Uncommitted (${s.dirty_entries})</strong></p><pre class="mono">${s.dirty_files.map((f) => `${esc(f.status)} ${esc(f.path)}`).join("\n")}</pre>` : "") +
          (s.stashes?.length ? `<p><strong>Stashes</strong></p><pre class="mono">${s.stashes.map(esc).join("\n")}</pre>` : "") +

            const url = (out.match(/url=(\S+)/) || [])[1];
            if (url) window.open(url, "_blank", "noopener");
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `failed: ${out}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const release = event.target.closest("button[data-release]");
      if (release) {
        const { release: action, id, device } = release.dataset;
        const command = action === "publish" ? `lmice tools publish ${id} --yes --format json` : `lmice tools install ${id} --device ${device} --yes --format json`;
        const note = action === "publish" ? "Builds from the release host's clean checkout for every target and uploads to Forgejo. Publishing the same commit again changes nothing." : "Downloads the newest published release, checks its checksum and switches the device to it; the previous version stays for rollback and a running tool is restarted.";
        askConfirm(command, note, async () => {
          $("meta").textContent = action === "publish" ? `publishing ${id}…` : `installing ${id} on ${device}…`;
          try {
            const job = await startJob({ kind: `tool-${action}`, id, device });
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `failed: ${job.view.data.detail || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const tool = event.target.closest("button[data-tool]");
      if (tool) {
        const { tool: id, device } = tool.dataset;
        askConfirm(`lmice tools update ${id} --device ${device} --yes --format json`, "Builds from that device's checkout; the previous install is kept as a backup and the tool is restarted if it was running. This can take a few minutes.", async () => {
          $("meta").textContent = `updating ${id} on ${device}…`;
          try {
            const job = await startJob({ kind: "tool-update", id, device });
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `update failed: ${job.view.data.output || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const toggle = event.target.closest("button[data-integration]");
      if (toggle) {
        const { integration, id, device } = toggle.dataset;
        askConfirm(`lmice integrations ${integration} ${id} --device ${device} --format json`, "This only changes whether LinuxMice uses the tool on that device.", async () => {
          $("meta").textContent = "updating…";
          try { await startJob({ kind: `integration-${integration}`, id, device }); } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
      }
    });
    $("view").addEventListener("change", (event) => {
      if (event.target.id === "moveA") { state.move.a = event.target.value; state.move.result = null; renderMove(); }
      if (event.target.id === "moveB") { state.move.b = event.target.value; state.move.result = null; renderMove(); }
      if (event.target.id === "setupDevice") { state.setup.device = event.target.value; if (state.setup.like === state.setup.device) state.setup.like = ""; state.setup.result = null; renderSetup(); }
      if (event.target.id === "setupLike") { state.setup.like = event.target.value; state.setup.result = null; renderSetup(); }
    });
    function fillHostDevices() {
      const devices = fleetDevices();
      const select = $("hostDevice");
      const current = state.selfhostDevice;
      select.innerHTML = `<option value="">${esc(state.caps?.device || "this node")} (this node)</option>` + devices.filter((d) => d !== state.caps?.device).map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
      select.value = current;
    }
    $("hostDevice").addEventListener("change", () => { state.selfhostDevice = $("hostDevice").value; load(false); });
    $("search").addEventListener("input", render);
    $("verdict").addEventListener("change", render);
    $("refresh").addEventListener("click", () => { if (state.tab === "move") { state.move.result = null; } if (state.tab === "devices") { state.views.health = null; } load(true); });
    $("diffRun").addEventListener("click", runDiff);
    $("diffPatch").addEventListener("change", runDiff);
    $("diffClose").addEventListener("click", () => $("diffDialog").close());

    (async () => {
      try { state.caps = await api("/v1/linuxmice/capabilities"); } catch (_) { state.caps = null; }
      hideOffModules();
      api("/v1/linuxmice/devices").then((view) => { state.views.devices = view; }).catch(() => {});
      api("/v1/linuxmice/attention").then((view) => { state.views.attention = state.views.attention || view; showAttentionCount(view.data); }).catch(() => {});
      setTab(location.hash.slice(1) || "attention", false);
    })();
  </script>
</body>
</html>
