      const v = state.vault, form = event.target, f = new FormData(form), isNew = v.editing === "new";
      const name = f.get("name").trim();
      const body = { vault: v.which, name, user: f.get("user").trim(), password: f.get("password"), totp: f.get("totp"), note: f.get("note"), domains: f.get("domains").split(/[\s,]+/).filter(Boolean) };
      if (isNew && !body.password && !body.note) { vaultMessage("Give a password, or press Generate password."); return; }
      vaultMessage("Saving…");
      try {
        const before = vaultEntry(name);
        await vaultAction("add", body);
        const ask = f.get("ask") === "on";
        if (ask !== !!before?.ask) await vaultAction("ask", { vault: v.which, name, on: ask });
        v.editing = null;
        vaultMessage(isNew ? `Saved ${name}.` : `Saved changes to ${name}.`);
      } catch (error) { vaultMessage(`Not saved: ${error.message}`); return; }
      state.views.changes = null;
      loadVault(true);
    }
    async function copyFromVault(kind, name) {
      const v = state.vault;
      try {
        let value = "";
        if (kind === "user") value = vaultEntry(name)?.user || "";
        else if (kind === "code") value = (await vaultAction("code", { vault: v.which, name })).value;
        else value = (await vaultAction("reveal", { vault: v.which, name })).value;
        await navigator.clipboard.writeText(value);
        if (kind === "user") { vaultMessage(`Copied the user of ${name}.`); return; }
        vaultMessage(`Copied the ${kind === "code" ? "one-time code" : "password"} of ${name}. The clipboard is cleared after 30 s, or when you come back to this page.`);
        setTimeout(() => navigator.clipboard.writeText("").catch(() => window.addEventListener("focus", () => navigator.clipboard.writeText("").catch(() => {}), { once: true })), 30000);
      } catch (error) { vaultMessage(`Not copied: ${error.message}`); }
    }
    $("view").addEventListener("submit", async (event) => {
      if (state.tab !== "vault" || event.target.id !== "vaultTarget") return;
      event.preventDefault();
      const v = state.vault, f = new FormData(event.target);
      vaultMessage("Adding the place…");
      try {
        await vaultAction("target", { vault: v.which, name: v.editing, device: f.get("device"), file: f.get("file").trim(), key: f.get("key").trim(), restart: f.get("restart").trim() });
        vaultMessage("Added. Press Write it there now to copy the value.");
      } catch (error) { vaultMessage(`Not added: ${error.message}`); return; }
      await loadVault(true); renderVault();
    });
    $("view").addEventListener("click", (event) => {
      if (state.tab !== "fleetfile") return;
      const b = event.target.closest("button");
      if (!b) return;
      if (b.hasAttribute("data-fleet-diff")) { showFleetDrift(); return; }
      const device = b.dataset.fleetApply;
      if (!device && !b.hasAttribute("data-fleet-capture")) return;
      const request = device ? { kind: "fleet-apply", device } : { kind: "fleet-capture" };
      askConfirm(device ? `lmice fleet apply --device ${device}` : "lmice fleet capture --commit",
        device ? "Puts the fleet file's settings back on the machine (the old ones are kept as .bak-fleet-*) and turns on its services, HTTPS sites and timers." : "Copies what every machine runs now into the fleet file, then commits and pushes it.",
        async () => {
          const job = await startJob(request);
          $("fleetMessage").textContent = job.state === "done" ? "done" : `failed: ${job.view.error || ""}`;
          if (device) showFleetDrift();
        });
    });
    $("view").addEventListener("click", (event) => {
      if (state.tab !== "https") return;
      const b = event.target.closest("button");
      if (!b) return;
      const remove = b.dataset.httpsRemove;
      if (!remove && !b.hasAttribute("data-https-apply")) return;
      const request = remove ? { kind: "https-remove", id: remove } : { kind: "https-apply" };
      askConfirm(remove ? `lmice https remove ${remove}` : "lmice https apply", remove ? "The site stops answering over HTTPS; the service itself is not touched." : "Renews the certificate when due and rewrites the nginx sites from https.toml.", async () => {
        const job = await startJob(request);
        $("meta").textContent = job.state === "done" ? "done" : `failed: ${job.view.error || ""}`;
        state.views.https = null; load(true);
      });
    });
    $("view").addEventListener("click", async (event) => {
      if (state.tab !== "vault") return;
      const v = state.vault, b = event.target.closest("button");
      if (!b) return;
      if (b.dataset.vaultWhich) { v.which = b.dataset.vaultWhich; v.editing = null; v.message = ""; renderVault(); return; }
      if (b.hasAttribute("data-vault-new")) { v.editing = "new"; v.message = ""; renderVault(); $("vaultForm")?.elements.name.focus(); return; }
      if (b.dataset.vaultEdit) { v.editing = b.dataset.vaultEdit; v.message = ""; renderVault(); $("vaultEditor")?.scrollIntoView({ block: "nearest" }); return; }
      if (b.hasAttribute("data-vault-close")) { v.editing = null; renderVault(); return; }
      if (b.hasAttribute("data-vault-generate")) {
        const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789-_.!";
        const random = crypto.getRandomValues(new Uint32Array(22));
        $("vaultForm").elements.password.value = Array.from(random, (n) => alphabet[n % alphabet.length]).join("");
        vaultMessage("Generated a 22-character password. It stays hidden; saving stores it.");
        return;
      }
      if (b.dataset.vaultCopy) { copyFromVault("password", b.dataset.vaultCopy); return; }
      if (b.dataset.vaultCode) { copyFromVault("code", b.dataset.vaultCode); return; }
      if (b.dataset.vaultCopyUser) { copyFromVault("user", b.dataset.vaultCopyUser); return; }
      if (b.dataset.vaultDecide) {
        try { await vaultAction("decide", { id: b.dataset.id, answer: b.dataset.vaultDecide }); vaultMessage("Answered."); } catch (error) { vaultMessage(`Not answered: ${error.message}`); }
        loadVault(true);
        return;
      }
      if (b.dataset.vaultUntarget) {
        const [device, file] = b.dataset.vaultUntarget.split("|");
        try { await vaultAction("target", { vault: v.which, name: v.editing, device, file, remove: true }); vaultMessage(`Stopped copying to ${device}.`); } catch (error) { vaultMessage(`Not changed: ${error.message}`); return; }
        await loadVault(true); renderVault();
        return;
      }
      const name = b.dataset.vaultPush || b.dataset.vaultRotate || b.dataset.vaultRemove;
      if (!name) return;
      const kind = b.dataset.vaultPush ? "push" : b.dataset.vaultRotate ? "rotate" : "remove";
      const run = async () => {
        vaultMessage({ push: "Writing it to every place…", rotate: "Rotating…", remove: "Removing…" }[kind]);
        try {
          const result = await vaultAction(kind, { vault: v.which, name });
          const failed = (result.targets || []).filter((t) => !t.ok);
          if (failed.length) vaultMessage(`${kind === "rotate" ? "Rotated, but not" : "Not"} written to ${failed.map((t) => `${t.device} (${t.detail})`).join(", ")}. Fix that, then press Write it there now.`);
          else vaultMessage({ push: `Wrote ${name} to every place.`, rotate: `Rotated ${name} everywhere.`, remove: `Removed ${name}.` }[kind]);
          if (kind === "remove") v.editing = null;
        } catch (error) { vaultMessage(`Failed: ${error.message}`); return; }
        state.views.changes = null;
        await loadVault(true); renderVault();
      };
      if (kind === "push") { run(); return; }
      askConfirm(`lmice vault ${kind} ${v.which}/${name}`, kind === "rotate" ? "A new random value replaces the old one in the vault and in every place it is copied to. The old files are kept as .bak-rotate-*." : "The login moves to the vault's .removed/ folder. Nothing is deleted.", run);
    });
    // What each page is for, in one sentence; the page's lmice command is
    // under its content.
    const PAGES = {
      attention: ["Attention", "What needs you across every device and server, most urgent first, each with its fix."],
      devices: ["Devices", "Every device: online or not, how busy, memory, disk and temperature."],
      setup: ["Setup", "What makes a device yours. Compare a device with its setup file, or with another device, and add what's missing."],
      tools: ["Tools", "Your own apps on each device: which version runs, whether it's running, and updates."],
      upkeep: ["Upkeep", "Routine care: outdated tools to update and old build output to clear."],
      rescue: ["Recovery", "How to get back in when something breaks: emergency access, the services that matter and their backups."],
      repos: ["Repositories", "Every repository on every device, and whether the copies match."],
      folders: ["Folders", "The folders you keep on more than one device, and whether they match."],
      move: ["Sync & move", "Bring two devices level, or move today's work to another device and continue there."],
      projects: ["Projects", "Your projects and where each stands. Retired ones can be tidied away."],
      selfhost: ["Self-hosting", "The services you host yourself, and whether they're up."],
      integrations: ["Integrations", "Optional connections LinuxMice uses on each device. Turn them on or off."],
      fleetfile: ["Fleet file", "Every machine, what it is for and what it runs, in one file. With it and last night's backup, any of them can be rebuilt on a fresh machine."],
      hardware: ["Hardware", "What each machine is, what it can still take, and what it costs to keep running, next to machines you could buy."],
      https: ["HTTPS", "Addresses like https://lawnmower.katteke.internal:3443 with Katteke's own certificates, reachable over the tailnet and LinuxMice's WireGuard, without Tailscale's."],
      backups: ["Backups", "Backups pulled from other machines, how fresh they are, and whether they can be read."],
      agents: ["Agents", "Claude sessions on lawnmower: Remote Control, their browser and their sandboxed desktops."],
      org: ["Organization", "Katteke's devices against its policies, who can sign in, and every change made through LinuxMice."],
      vault: ["Vault", "Passwords and tokens for you and your agents, in three vaults with their own keys: personal, katteke and work."],
    };
    function setTab(tab, push = true) {
      if (!PAGES[tab]) tab = "attention";
      state.tab = tab;
      document.querySelectorAll("#tabs button[data-tab]").forEach((b) => {
        const on = b.dataset.tab === tab;
        b.classList.toggle("active", on);
        if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
      });
      $("pageTitle").textContent = PAGES[tab][0];
      $("pageLead").textContent = PAGES[tab][1];
      document.title = `${PAGES[tab][0]} · LinuxMice Fleet`;
      if (push && location.hash !== `#${tab}`) history.pushState(null, "", `#${tab}`);
      if (tab === "selfhost") fillHostDevices();
      load(false);
    }
    function showAttentionCount(data) {
      const badge = $("attentionCount");
      const items = data?.items || [];
      const critical = items.filter((i) => i.severity === "critical").length;
      const warn = items.filter((i) => i.severity === "warn").length;
      badge.hidden = !(critical || warn);
      badge.textContent = critical || warn;
      badge.className = `count ${critical ? "bad" : "warn"}`;
      badge.title = `${critical} critical, ${warn} warnings`;
    }
    $("tabs").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-tab]");
      if (button) setTab(button.dataset.tab);
    });
    window.addEventListener("popstate", () => setTab(location.hash.slice(1), false));
    $("view").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-location]");
      if (row && row.dataset.location) { openDiff(row.dataset.location); return; }
      const plan = event.target.closest("button[data-plan]");
      if (plan) { runMoveJob(plan.dataset.plan); return; }
      const execute = event.target.closest("button[data-execute]");
      if (execute) {
        const m = state.move;
        const command = {
          "execute-sync": `lmice workspace sync ${m.a} ${m.b} --format json --execute`,
          "execute-switch": `lmice workspace switch ${m.b} --from ${m.a} --format json --execute`,
          "execute-carry": `lmice workspace carry ${m.a} --to ${m.b} --format json --execute`,
        }[execute.dataset.execute];
        const note = execute.dataset.execute === "execute-switch"
          ? `Nothing is deleted. Uncommitted work moves to ${m.b}; ${m.a}'s copy of each moved checkout is saved under refs/lmice/switched/ (git stash apply restores it).`
          : "Nothing is deleted; replaced files are archived first, and the result is checked again afterwards.";
        askConfirm(command, note, () => runMoveJob(execute.dataset.execute));
        return;
      }
      if (event.target.closest("button[data-upkeep]")) {
        askConfirm("lmice upkeep --yes --format json", "Updates outdated tools from clean checkouts, rebuilds apps with a newer upstream release, and removes build output unused for 14 days on every device. Builds can take several minutes (an app rebuild about ten).", async () => {
          $("meta").textContent = "running upkeep on every device (builds can take several minutes)…";
          try {
            const job = await startJob({ kind: "execute-upkeep" });
            state.views.upkeep = job.view;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          render();
        });
        return;
      }
      const fix = event.target.closest("button[data-fix]");
      if (fix) {
        const { fix: kind, id, device, label, title } = fix.dataset;
        const command = {
          "server-update": `lmice servers update ${id} --yes --format json`,
          "server-reboot": `lmice servers reboot ${id} --yes --format json`,
          "backups-pull": "lmice backups pull --yes --format json",
          "agents-desktop-on": `lmice agents desktop on --device ${device} --yes --format json`,
          "org-fix": `lmice org fix ${device} ${id} --yes --format json`,
        }[kind];
        if (!command) return;
        const note = {
          "server-update": "Installs the pending updates on the server, detached, and waits for them (a few minutes). Services may restart briefly.",
          "server-reboot": "Restarts the server and waits until it answers again (about a minute of downtime).",
          "backups-pull": "Fetches missing backup copies and checks them.",
          "agents-desktop-on": "Re-applies the agent desktops' firewall and checks it from inside.",
          "org-fix": id === "screen-lock" ? "Turns the screen lock on (the screen locks when idle and asks for the password)." : "Installs unattended-upgrades and turns automatic security updates on (the old setting is kept as a backup).",
        }[kind];
        askConfirm(command, `${title}: ${note}`, async () => {
          $("meta").textContent = `${label.toLowerCase()}…`;
          try {
            const job = await startJob({ kind, id, device });
            const d = job.view?.data;
            if (d && d.success === false) $("meta").textContent = `${label} did not finish cleanly: ${d.output || d.detail || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          state.views.changes = null;
          load(true);
        });
        return;
      }
      if (event.target.closest("button[data-backups-pull]")) {
        askConfirm("lmice backups pull --yes --format json", "Fetches missing backup copies the retention keeps, checks their checksums, and removes copies outside the retention.", async () => {
          $("meta").textContent = "pulling backups…";
          try {
            const job = await startJob({ kind: "backups-pull" });
            if (job.view?.data) state.views.backups = job.view;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          render();
        });
        return;
      }
      if (event.target.closest("button[data-projects]")) {
        askConfirm("lmice projects tidy --yes --format json", "Turns off the services of retired projects and moves their binaries into ~/.local/share/linuxmice/retired/ on each device. Nothing is deleted.", async () => {
          $("meta").textContent = "tidying retired projects…";
          try {
            const job = await startJob({ kind: "projects-tidy" });
            const failed = (job.view?.data?.actions || []).filter((a) => a.success === false);
            if (failed.length) $("meta").textContent = `failed: ${failed.map((a) => `${a.project} on ${a.device}: ${a.detail}`).join("; ")}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const agents = event.target.closest("button[data-agents]");
      if (agents) {
        const { agents: kind, device } = agents.dataset;
        const words = { "agents-start": "start", "agents-stop": "stop", "agents-browser-on": "browser on", "agents-browser-off": "browser off", "agents-desktop-on": "desktop on", "agents-desktop-off": "desktop off" }[kind];
        const notes = {
          "agents-start": "Keeps Claude Code Remote Control running as a user service; sessions you open from the Claude app or claude.ai/code run there.",
          "agents-stop": "Stops the Remote Control service; open sessions end.",
          "agents-browser-on": "Registers a private headless browser for every new Claude session (downloads a browser, about 400 MB on disk, once).",
          "agents-browser-off": "New Claude sessions start without the agent browser.",
          "agents-desktop-on": "Gives every Claude session on this device its own sandboxed desktop on first use (the first time builds a 1.4 GB image). A test desktop must prove it can't reach your network first. Each desktop: at most 2 GB of memory and 2 CPUs; at most 3 at once.",
          "agents-desktop-off": "Removes the desktop tools from Claude Code and closes desktops in use.",
        };
        askConfirm(`lmice agents ${words} --device ${device} --yes --format json`, notes[kind], async () => {
          $("meta").textContent = `agents ${words} on ${device}…`;
          try {
            const job = await startJob({ kind, device });
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `failed: ${job.view.data.output || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const setupButton = event.target.closest("button[data-setup]");
      if (setupButton) { runSetupJob(setupButton.dataset.setup); return; }
      const desktopProfile = event.target.closest("button[data-desktop-profile]");
      if (desktopProfile) {
        const { desktopProfile: action, id, device } = desktopProfile.dataset;
        const note = action === "open"
          ? `Starts your ${id} desktop so you can sign in to sites there; every Claude session that picks ${id} starts from a copy of these sign-ins. It stays open until you close it.`
          : `Closes your ${id} desktop. Its sign-ins and files are kept for next time.`;
        askConfirm(`lmice agents desktop ${action} ${id} --device ${device} --yes --format json`, note, async () => {
          $("meta").textContent = `${action === "open" ? "opening" : "closing"} the ${id} desktop…`;
          try {
            const job = await startJob({ kind: `agents-desktop-${action}`, id, device });
            const out = job.view?.data?.output || "";
            const url = (out.match(/url=(\S+)/) || [])[1];
            if (url) window.open(url, "_blank", "noopener");
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `failed: ${out}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const release = event.target.closest("button[data-release]");
      if (release) {
        const { release: action, id, device } = release.dataset;
        const command = action === "publish" ? `lmice tools publish ${id} --yes --format json` : `lmice tools install ${id} --device ${device} --yes --format json`;
        const note = action === "publish" ? "Builds from the release host's clean checkout for every target and uploads to Forgejo. Publishing the same commit again changes nothing." : "Downloads the newest published release, checks its checksum and switches the device to it; the previous version stays for rollback and a running tool is restarted.";
        askConfirm(command, note, async () => {
          $("meta").textContent = action === "publish" ? `publishing ${id}…` : `installing ${id} on ${device}…`;
          try {
            const job = await startJob({ kind: `tool-${action}`, id, device });
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `failed: ${job.view.data.detail || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const tool = event.target.closest("button[data-tool]");
      if (tool) {
        const { tool: id, device } = tool.dataset;
        askConfirm(`lmice tools update ${id} --device ${device} --yes --format json`, "Builds from that device's checkout; the previous install is kept as a backup and the tool is restarted if it was running. This can take a few minutes.", async () => {
          $("meta").textContent = `updating ${id} on ${device}…`;
          try {
            const job = await startJob({ kind: "tool-update", id, device });
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `update failed: ${job.view.data.output || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const toggle = event.target.closest("button[data-integration]");
      if (toggle) {
        const { integration, id, device } = toggle.dataset;
        askConfirm(`lmice integrations ${integration} ${id} --device ${device} --format json`, "This only changes whether LinuxMice uses the tool on that device.", async () => {
          $("meta").textContent = "updating…";
          try { await startJob({ kind: `integration-${integration}`, id, device }); } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
      }
    });
    $("view").addEventListener("change", (event) => {
      if (event.target.id === "moveA") { state.move.a = event.target.value; state.move.result = null; renderMove(); }
      if (event.target.id === "moveB") { state.move.b = event.target.value; state.move.result = null; renderMove(); }
      if (event.target.id === "setupDevice") { state.setup.device = event.target.value; if (state.setup.like === state.setup.device) state.setup.like = ""; state.setup.result = null; renderSetup(); }
      if (event.target.id === "setupLike") { state.setup.like = event.target.value; state.setup.result = null; renderSetup(); }
    });
    function fillHostDevices() {
      const devices = fleetDevices();
      const select = $("hostDevice");
      const current = state.selfhostDevice;
      select.innerHTML = `<option value="">${esc(state.caps?.device || "this node")} (this node)</option>` + devices.filter((d) => d !== state.caps?.device).map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
      select.value = current;
    }
    $("hostDevice").addEventListener("change", () => { state.selfhostDevice = $("hostDevice").value; load(false); });
    $("search").addEventListener("input", render);
    $("verdict").addEventListener("change", render);
    $("refresh").addEventListener("click", () => { if (state.tab === "move") { state.move.result = null; } if (state.tab === "devices") { state.views.health = null; } load(true); });
    $("diffRun").addEventListener("click", runDiff);
    $("diffPatch").addEventListener("change", runDiff);
    $("diffClose").addEventListener("click", () => $("diffDialog").close());

    (async () => {
      try { state.caps = await api("/v1/linuxmice/capabilities"); } catch (_) { state.caps = null; }
      api("/v1/linuxmice/devices").then((view) => { state.views.devices = view; }).catch(() => {});
      api("/v1/linuxmice/attention").then((view) => { state.views.attention = state.views.attention || view; showAttentionCount(view.data); }).catch(() => {});
      setTab(location.hash.slice(1) || "attention", false);
    })();
  </script>
</body>
</html>
