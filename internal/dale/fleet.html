<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Workspace</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --line: #d8dde5;
      --text: #1f2328;
      --muted: #66707c;
      --accent: #2f6fd6;
      --ok: #1f7a4d;
      --warn: #8a6400;
      --bad: #b42318;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101112;
        --surface: #171819;
        --surface-2: #202225;
        --line: #30343a;
        --text: #f1f3f5;
        --muted: #a4abb4;
        --accent: #74a7ff;
        --ok: #5cc98f;
        --warn: #e0b84f;
        --bad: #ff7b72;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    header h1 { margin: 0; font-size: 17px; }
    a { color: var(--accent); text-decoration: none; }
    main { padding: 16px; max-width: 1400px; margin: 0 auto; }
    h3 { margin: 18px 0 8px; font-size: 15px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    button, select, input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button.danger { border-color: var(--bad); color: var(--bad); }
    .tabs button.active { border-color: var(--accent); color: var(--accent); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .toolbar input[type=search] { min-width: 0; flex: 1 1 180px; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; word-break: break-word; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .cards { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; min-width: 150px; }
    .card strong { display: block; }
    .card span { color: var(--muted); font-size: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
    .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
    th { background: var(--surface-2); font-weight: 600; position: sticky; top: 0; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--surface-2); }
    td.detail { white-space: normal; min-width: 200px; max-width: 420px; color: var(--muted); }
    td.name { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
    .pill.ok { color: var(--ok); }
    .pill.warn { color: var(--warn); }
    .pill.bad { color: var(--bad); }
    .muted { color: var(--muted); }
    .empty { padding: 24px; color: var(--muted); }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
    dialog { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 0; }
    dialog .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 8px; flex-wrap: wrap; }
    dialog .body { padding: 12px 16px; overflow: auto; max-height: calc(100vh - 140px); }
    @media (max-width: 640px) { main { padding: 12px 16px; } th, td { padding: 6px 8px; } }
  </style>
</head>
<body>
  <header>
    <h1>Fleet workspace</h1>
    <span class="muted">Every view is one <code>lmice</code> command, shown above it · <a href="/dashboard">Dashboard</a></span>
  </header>
  <main>
    <div class="tabs" id="tabs">
      <button data-tab="repos" class="active" type="button">Repositories</button>
      <button data-tab="folders" type="button">Folders</button>
      <button data-tab="devices" type="button">Devices</button>
      <button data-tab="move" type="button">Sync &amp; move</button>
      <button data-tab="upkeep" type="button">Upkeep</button>
      <button data-tab="agents" type="button">Agents</button>
      <button data-tab="tools" type="button">Tools</button>
      <button data-tab="integrations" type="button">Integrations</button>
      <button data-tab="selfhost" type="button">Self-hosting</button>
      <button data-tab="rescue" type="button">Health</button>
    </div>
    <div class="toolbar" id="toolbar">
      <input id="search" type="search" placeholder="Filter by name or path" aria-label="Filter">
      <select id="verdict" aria-label="Verdict"><option value="!same" selected>Needs a look (not same)</option></select>
      <select id="hostDevice" aria-label="Device" style="display:none"></select>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div class="meta" id="meta">loading…</div>
    <div class="cards" id="cards"></div>
    <div id="view"></div>
  </main>

  <dialog id="diffDialog">
    <div class="head">
      <strong id="diffTitle">Diff</strong>
      <span class="toolbar" style="margin:0">
        <select id="diffA" aria-label="First device"></select>
        <select id="diffB" aria-label="Second device"></select>
        <label class="muted"><input id="diffPatch" type="checkbox"> show changes (--patch)</label>
        <button id="diffRun" type="button">Compare</button>
        <button id="diffClose" type="button">Close</button>
      </span>
    </div>
    <div class="body" id="diffBody"></div>
  </dialog>

  <dialog id="confirmDialog">
    <div class="head"><strong>Run this change?</strong></div>
    <div class="body">
      <p>This runs on <span id="confirmNode"></span> exactly as if you typed it:</p>
      <pre class="mono panel" id="confirmCommand"></pre>
      <p class="muted" id="confirmNote"></p>
      <div class="toolbar"><button class="danger" id="confirmYes" type="button">Run it</button><button id="confirmNo" type="button">Cancel</button></div>
    </div>
  </dialog>

  <script>
    const state = { tab: "repos", views: {}, caps: null, location: "", move: { a: "", b: "", result: null, kind: "", running: false }, selfhostDevice: "" };
    const $ = (id) => document.getElementById(id);

    function authHeaders() {
      const token = localStorage.getItem("masterdale.dashboard.token") || "";
      return token ? { "Authorization": `Bearer ${token}` } : {};
    }
    async function api(path, options = {}) {
      const opts = Object.assign({}, options, { headers: Object.assign({}, options.headers || {}, authHeaders()) });
      let res = await fetch(path, opts);
      if (res.status === 401) {
        if (res.headers.get("X-Masterdale-OIDC") === "enabled") { window.location.assign("/auth/oidc/start"); throw new Error("signing in"); }
        const token = window.prompt("Masterdale token");
        if (token) { localStorage.setItem("masterdale.dashboard.token", token.trim()); opts.headers = Object.assign({}, options.headers || {}, authHeaders()); res = await fetch(path, opts); }
      }
      const text = await res.text();
      let body = null;
      try { body = JSON.parse(text); } catch (_) { body = null; }
      if (!res.ok) throw new Error((body && body.error) || `${res.status} ${text}`);
      return body;
    }
    async function startJob(request) {
      const job = await api("/v1/linuxmice/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(request) });
      for (;;) {
        await new Promise((resolve) => setTimeout(resolve, 1500));
        const current = await api(`/v1/linuxmice/jobs/${job.id}`);
        if (current.state !== "running") return current;
      }
    }
    function esc(value) { return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function bytes(n) { if (!n) return "0 B"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return `${n.toFixed(i ? 1 : 0)} ${u[i]}`; }
    const LEVEL = { on: "ok", off: "", "logged in": "ok", "not logged in": "warn", same: "ok", ok: "ok", online: "ok", active: "ok", done: "ok", ready: "ok", info: "", repository: "", planned: "", dirty: "warn", behind: "warn", differs: "warn", "only-on": "warn", attention: "warn", warning: "warn", warn: "warn", "not-ready": "warn", unknown: "warn", diverged: "bad", offline: "bad", unreachable: "bad", unhealthy: "bad", error: "bad", failed: "bad", blocker: "bad", critical: "bad", "endpoint-outdated": "bad" };
    function pill(code) { return `<span class="pill ${LEVEL[code] ?? ""}">${esc(code)}</span>`; }
    function meta(view) {
      if (!view) return "";
      if (!view.available) return esc(view.hint || "LinuxMice is not installed on this node");
      const when = view.generated_at ? new Date(view.generated_at).toLocaleTimeString() : "";
      return `<code>$ ${esc(view.command)}</code> · ${esc(when)} · ${(view.duration_ms / 1000).toFixed(1)}s · exit ${view.exit_code ?? 0}`;
    }
    function filterText() { return $("search").value.trim().toLowerCase(); }
    function verdictFilter(code) {
      const want = $("verdict").value;
      if (!want) return true;
      if (want === "!same") return code !== "same";
      return code === want;
    }
    function fleetDevices() {
      const devices = state.views.devices?.data?.devices?.map((d) => d.id) || state.views.map?.data?.devices?.map((d) => d.device) || [];
      return [...new Set(devices)];
    }
    function viewName() { return { repos: "map", folders: "map", move: "devices" }[state.tab] || state.tab; }

    async function load(force) {
      const name = viewName();
      let path = `/v1/linuxmice/${name}`;
      const params = new URLSearchParams();
      if (name === "selfhost" && state.selfhostDevice) params.set("device", state.selfhostDevice);
      if (force) params.set("refresh", "1");
      if ([...params].length) path += `?${params}`;
      const key = name === "selfhost" ? `selfhost:${state.selfhostDevice}` : name;
      if (!force && state.views[key]) { render(); return; }
      $("meta").textContent = name === "map" ? "collecting manifests from every fleet device (about a minute)…" : "loading…";
      $("view").innerHTML = "";
      $("cards").innerHTML = "";
      try {
        state.views[key] = await api(path);
      } catch (error) {
        $("meta").textContent = `failed: ${error.message}`;
        return;
      }
      render();
    }

    function render() {
      const name = viewName();
      const view = state.tab === "selfhost" ? state.views[`selfhost:${state.selfhostDevice}`] : state.views[name];
      $("verdict").style.display = state.tab === "repos" || state.tab === "folders" ? "" : "none";
      $("search").style.display = ["repos", "folders", "selfhost", "integrations", "tools"].includes(state.tab) ? "" : "none";
      $("hostDevice").style.display = state.tab === "selfhost" ? "" : "none";
      $("meta").innerHTML = meta(view);
      $("cards").innerHTML = "";
      if (!view || !view.data) {
        $("view").innerHTML = `<div class="empty">${esc(view?.error || view?.hint || "No data")}</div>`;
        return;
      }
      ({ repos: renderRepos, folders: renderFolders, devices: renderDevices, move: renderMove, upkeep: renderUpkeep, agents: renderAgents, tools: renderTools, integrations: renderIntegrations, selfhost: renderSelfhost, rescue: renderRescue })[state.tab](view.data);
    }

    function deviceCards(data) {
      $("cards").innerHTML = data.devices.map((d) => `<div class="card"><strong>${esc(d.device)}${d.local ? " (this node)" : ""} ${pill(d.status)}</strong><span>${d.collected ? `${d.repositories} repos · ${d.files} files · ${bytes(d.bytes)}` : esc(d.detail)}</span></div>`).join("");
    }
    function verdictOptions(codes) {
      const select = $("verdict");
      const current = select.value;
      select.innerHTML = `<option value="">All verdicts</option><option value="!same">Needs a look (not same)</option>` + Object.entries(codes).map(([code, n]) => `<option value="${esc(code)}">${esc(code)} (${n})</option>`).join("");
      select.value = [...select.options].some((o) => o.value === current) ? current : "!same";
    }

    function renderRepos(data) {
      deviceCards(data);
      verdictOptions(data.counts.repository_verdicts);
      const devices = data.devices.filter((d) => d.collected).map((d) => d.device);
      const text = filterText();
      const rows = data.repositories.filter((r) => verdictFilter(r.verdict.code) && (!text || `${r.name} ${r.checkouts.map((c) => c.path).join(" ")}`.toLowerCase().includes(text)));
      const cell = (repo, device) => {
        const c = repo.checkouts.find((x) => x.device === device);
        if (!c) return `<td class="muted">—</td>`;
        if (c.error) return `<td class="mono" title="${esc(c.error)}">error</td>`;
        const marks = [c.dirty_entries ? `*${c.dirty_entries}` : "", c.stash_entries ? `s${c.stash_entries}` : "", c.local_only_commits ? `+${c.local_only_commits}` : ""].filter(Boolean).join(" ");
        return `<td class="mono" title="${esc(c.path)}">${esc(c.branch || "detached")} ${esc(c.head_short || "")} <span style="color:var(--warn)">${esc(marks)}</span></td>`;
      };
      $("view").innerHTML = rows.length ? `<div class="scroll"><table><thead><tr><th>Repository</th><th>Verdict</th>${devices.map((d) => `<th>${esc(d)}</th>`).join("")}<th>Detail</th></tr></thead><tbody>${rows.map((r) => `<tr class="clickable" data-location="${esc(r.checkouts[0]?.path || "")}"><td class="name" title="${esc(r.name)}">${esc(r.name)}</td><td>${pill(r.verdict.code)}</td>${devices.map((d) => cell(r, d)).join("")}<td class="detail">${esc(r.verdict.detail)}</td></tr>`).join("")}</tbody></table></div><p class="muted">*N uncommitted · sN stashes · +N commits on no remote. Click a row to compare two devices.</p>` : `<div class="empty">Nothing matches.</div>`;
    }

    function renderFolders(data) {
      deviceCards(data);
      verdictOptions(data.counts.folder_verdicts);
      const devices = data.devices.filter((d) => d.collected).map((d) => d.device);
      const text = filterText();
      const rows = data.folders.filter((f) => verdictFilter(f.verdict.code) && (!text || f.path.toLowerCase().includes(text)));
      const cell = (folder, device) => {
        const d = folder.devices.find((x) => x.device === device);
        if (!d || !d.present) return `<td class="muted">—</td>`;
        if (folder.is_repository) return `<td class="muted">repo</td>`;
        return `<td>${d.files} files · ${bytes(d.bytes)}${d.repositories ? ` · ${d.repositories} repos` : ""}</td>`;
      };
      $("view").innerHTML = rows.length ? `<div class="scroll"><table><thead><tr><th>Folder</th><th>Verdict</th>${devices.map((d) => `<th>${esc(d)}</th>`).join("")}<th>Detail</th></tr></thead><tbody>${rows.map((f) => `<tr class="clickable" data-location="${esc(f.path)}"><td class="mono name" title="${esc(f.path)}">${esc(f.path)}</td><td>${pill(f.verdict.code)}</td>${devices.map((d) => cell(f, d)).join("")}<td class="detail">${esc(f.verdict.detail)}</td></tr>`).join("")}</tbody></table></div><p class="muted">Files inside Git checkouts are counted under Repositories. Click a row to compare two devices.</p>` : `<div class="empty">Nothing matches.</div>`;
    }

    function healthCells(h) {
      if (!h || !h.os) return `<td colspan="6" class="detail">${esc(h?.detail || "loading health…")}</td>`;
      const disk = h.disks.reduce((worst, d) => (!worst || d.used_percent > worst.used_percent ? d : worst), null);
      const hottest = h.temperatures.reduce((top, t) => (!top || t.celsius > top.celsius ? t : top), null);
      const fan = h.fans[0];
      return `<td>${h.load ? `${h.load[0].toFixed(1)} / ${h.cores} cores` : "—"}</td>` +
        `<td>${h.memory ? `${h.memory.used_percent.toFixed(0)}%` : "—"}</td>` +
        `<td>${disk ? `${disk.used_percent.toFixed(0)}% <span class="muted">${bytes(disk.available_kib * 1024)} free</span>` : "—"}</td>` +
        `<td>${hottest ? `${hottest.celsius.toFixed(0)} °C` : `<span class="muted">n/a</span>`}</td>` +
        `<td>${fan ? `${fan.rpm}${fan.max_rpm ? ` / ${fan.max_rpm}` : ""} rpm` : `<span class="muted">n/a</span>`}</td>` +
        `<td class="detail">${esc(h.detail)}${h.top_processes.length ? `<br>busiest: ${esc(h.top_processes.slice(0, 3).map((p) => `${p.command} ${p.cpu_percent.toFixed(0)}%`).join(", "))}` : ""}${h.battery ? `<br>battery ${h.battery.percent}% ${esc(h.battery.state)}` : ""}</td>`;
    }
    function renderDevices(data) {
      const health = state.views.health?.data?.devices || [];
      if (!state.views.health && !state.healthLoading) {
        state.healthLoading = true;
        api("/v1/linuxmice/health").then((view) => { state.views.health = view; state.healthLoading = false; if (state.tab === "devices") render(); }).catch(() => { state.healthLoading = false; });
      }
      const healthMeta = state.views.health ? `<div class="meta">${meta(state.views.health)}</div>` : "";
      $("view").innerHTML = healthMeta + `<div class="scroll"><table><thead><tr><th>Device</th><th>SSH</th><th>Health</th><th>CPU load</th><th>Memory</th><th>Disk</th><th>Temp</th><th>Fan</th><th>Detail</th></tr></thead><tbody>${data.devices.map((d) => {
        const h = health.find((x) => x.device === d.id);
        return `<tr><td>${esc(d.id)}<br><span class="muted mono">${esc(d.target)}</span></td><td>${pill(d.state)}<br><span class="muted">${d.duration_ms} ms</span></td><td>${h ? pill(h.status) : ""}</td>${healthCells(h)}</tr>`;
      }).join("")}</tbody></table></div>
        <p class="muted">Health comes from a small read-only probe (<code>lmice health --fleet</code>); macOS does not expose temperatures or fans without extra tools.</p>
        <h3>Add a new device</h3>
        <div class="panel">
          <p>Joining asks for the new device's password once, so it runs in a terminal, not here:</p>
          <ol>
            <li>On the new Linux device: <code>sudo apt install openssh-server</code> and join the tailnet (<code>curl -fsSL https://tailscale.com/install.sh | sh</code>, then <code>sudo tailscale up</code>).</li>
            <li>On any fleet device: <code>lmice fleet join NAME --target USER@ADDRESS --install-packages confirm</code></li>
            <li>Then use <strong>Sync &amp; move</strong> here (or <code>lmice workspace carry lawnmower --to NAME --execute</code>) to move your work onto it.</li>
          </ol>
        </div>`;
    }

    function renderMove() {
      const devices = fleetDevices();
      const m = state.move;
      if (!m.a) m.a = state.caps?.device && devices.includes(state.caps.device) ? state.caps.device : devices[0] || "";
      if (!m.b || m.b === m.a) m.b = devices.find((d) => d !== m.a) || "";
      const option = (d, selected) => `<option ${d === selected ? "selected" : ""}>${esc(d)}</option>`;
      const canExecute = state.caps?.actions_enabled;
      let html = `<div class="panel"><div class="toolbar">
          <label>Device <select id="moveA">${devices.map((d) => option(d, m.a)).join("")}</select></label>
          <label>and <select id="moveB">${devices.map((d) => option(d, m.b)).join("")}</select></label>
          <button data-plan="plan-sync" class="primary" type="button" ${m.running ? "disabled" : ""}>Plan sync (both ways)</button>
          <button data-plan="plan-switch" type="button" ${m.running ? "disabled" : ""}>Move my work ${esc(m.a)} → ${esc(m.b)} (switch)</button>
          <button data-plan="plan-retire" type="button" ${m.running ? "disabled" : ""}>Can I switch off ${esc(m.a)}? (retire)</button>
          <button data-plan="plan-carry" type="button" ${m.running ? "disabled" : ""}>Plan carry ${esc(m.a)} → ${esc(m.b)}</button>
        </div>
        <p class="muted">Plans change nothing. ${canExecute ? "After a plan, a Run button appears; it asks before running." : "Running changes from this page is turned off on this node (DALE_LINUXMICE_ACTIONS); copy the command into a terminal instead."}</p></div>`;
      if (m.running) html += `<div class="empty">running <code>${esc(m.running)}</code>… (a sync plan takes a few minutes)</div>`;
      else if (m.result) html += renderJobResult(m.result, canExecute);
      $("view").innerHTML = html;
    }

    function renderJobResult(job, canExecute) {
      const view = job.view || {};
      let html = `<div class="meta">${meta(view)}</div>`;
      if (!view.data) return html + `<div class="empty">${esc(view.error || view.hint || job.state)}</div>`;
      const d = view.data;
      if (d.schema_version === "linuxmice.workspace.switch.v1") {
        const inner = renderJobResult({ view: Object.assign({}, view, { data: d.sync }) }, false).replace(/^<div class="meta">.*?<\/div>/, "");
        html += `<p>Switch ${esc(d.from)} → ${esc(d.to)}${d.executed ? " (done)" : " (plan)"}</p>` + inner;
        const items = (title, list) => list.length ? `<h3>${esc(title)}</h3><div class="scroll"><table><tbody>${list.map((i) => `<tr><td class="mono name" title="${esc(i.location)}">${esc(i.location)}</td><td class="detail">${esc(i.detail)}</td></tr>`).join("")}</tbody></table></div>` : "";
        html += items(`Work that continues on ${d.to}`, d.moved) + items(`Uncommitted work on ${d.from}`, d.stays);
        html += `<h3>Continue on ${esc(d.to)}</h3><pre class="mono panel">${d.continue_with.map(esc).join("\n")}</pre>`;
        if (!d.executed && canExecute) html += `<button class="danger" data-execute="execute-switch" type="button">Run this switch…</button>`;
        return html;
      }
      if (d.schema_version === "linuxmice.workspace.sync.v1") {
        const steps = d.directions.reduce((n, dir) => n + dir.steps.length, 0);
        html += `<p>${d.executed ? (d.in_sync ? pill("same") + " in sync" : pill("attention") + " not fully in sync") : `${steps} step(s) planned`} · folders: <span class="mono">${esc(d.roots.join(", "))}</span></p>`;
        html += d.directions.map((dir) => `<h3>${esc(dir.from)} → ${esc(dir.to)}: ${dir.steps.length} step(s)${dir.provisional ? " (re-planned after the first direction runs)" : ""}</h3>` + stepsTable(dir.steps)).join("");
        html += attention(d.needs_attention.map((a) => ({ kind: a.kind, where: `${a.location} (${a.device})`, detail: a.detail })));
        html += d.notes.map((n) => `<p class="muted">${esc(n)}</p>`).join("");
        if (!d.executed && steps && canExecute) html += `<button class="danger" data-execute="execute-sync" type="button">Run this sync…</button>`;
      } else if (d.schema_version === "linuxmice.workspace.carry.v1") {
        html += `<p>${d.executed ? (d.ready_after ? pill("ready") + " ready afterwards" : pill("not-ready") + ` ${d.blockers_after} blocker(s) left`) : `${d.steps.length} step(s) planned`} · ${d.blockers_before} blocker(s) before</p>`;
        html += stepsTable(d.steps);
        if (d.needs_attention.length) html += `<h3>Needs a person</h3><pre class="mono panel">${d.needs_attention.map(esc).join("\n")}</pre>`;
        if (!d.executed && d.steps.length && canExecute) html += `<button class="danger" data-execute="execute-carry" type="button">Run this carry…</button>`;
      } else if (Array.isArray(d.findings)) {
        html += `<p>${d.ready ? pill("ready") + ` nothing exists only on ${esc(d.device)}; it can be switched off` : pill("not-ready") + ` ${d.counts.blockers} blocker(s): these exist only on ${esc(d.device)}`}</p>`;
        html += d.findings.length ? `<div class="scroll"><table><thead><tr><th>Severity</th><th>What</th><th>Where</th><th>Detail</th></tr></thead><tbody>${d.findings.map((f) => `<tr><td>${pill(f.severity)}</td><td>${esc(f.code)}</td><td class="mono name" title="${esc(f.location)}">${esc(f.location)}</td><td class="detail">${esc(f.detail)}${f.suggestion ? `<br><em>${esc(f.suggestion)}</em>` : ""}</td></tr>`).join("")}</tbody></table></div>` : "";
      } else {
        html += `<pre class="mono panel">${esc(JSON.stringify(d, null, 2))}</pre>`;
      }
      return html;
    }
    function stepsTable(steps) {
      if (!steps.length) return `<p class="muted">nothing to do</p>`;
      return `<div class="scroll"><table><thead><tr><th>Status</th><th>Step</th><th>Where</th><th>Detail</th></tr></thead><tbody>${steps.map((s) => `<tr><td>${pill(s.status)}</td><td>${esc(s.action)}</td><td class="mono name" title="${esc(s.location)}">${esc(s.location)}</td><td class="detail">${esc(s.detail)}${s.output && s.status === "failed" ? `<pre class="mono">${esc(s.output)}</pre>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
    }
    function attention(items) {
      if (!items.length) return "";
      return `<h3>Needs a person (left alone)</h3><div class="scroll"><table><tbody>${items.map((a) => `<tr><td>${pill(a.kind)}</td><td class="mono name" title="${esc(a.where)}">${esc(a.where)}</td><td class="detail">${esc(a.detail)}</td></tr>`).join("")}</tbody></table></div>`;
    }
    async function runMoveJob(kind) {
      const m = state.move;
      if (m.a === m.b) { m.result = { view: { error: "pick two different devices" } }; renderMove(); return; }
      m.running = kind.startsWith("plan-") ? kind.replace("plan-", "planning ") : kind;
      m.kind = kind;
      renderMove();
      try {
        m.result = await startJob({ kind, a: m.a, b: m.b });
      } catch (error) {
        m.result = { view: { error: error.message } };
      }
      m.running = false;
      if (state.tab === "move") renderMove();
    }

    function renderUpkeep(data) {
      const canChange = state.caps?.actions_enabled;
      const size = (kib) => bytes(kib * 1024);
      $("view").innerHTML = `<div class="panel"><p>Routine care for every device: updates outdated tools whose checkout is clean, and removes build output (target/, node_modules, ...) unused for 14 days. Python virtualenvs and dirty checkouts are left alone; health is only reported.</p>${data.devices.some((d) => d.updates.length || d.reclaimable_folders) ? `<button class="danger" data-upkeep="run" type="button" ${canChange ? "" : "disabled"}>Run upkeep…</button>` : `<p>${pill("same")} nothing to do</p>`}</div>` +
        `<div class="scroll"><table><thead><tr><th>Device</th><th>Health</th><th>Updates</th><th>Old build output</th><th>Left alone</th></tr></thead><tbody>${data.devices.map((d) => {
          if (!d.reachable) return `<tr><td>${esc(d.device)}</td><td>${pill(d.health.status || "offline")}</td><td colspan="3" class="detail">${esc(d.health.detail)}</td></tr>`;
          const done = data.executed;
          const updates = done ? d.update_results.map((u) => `${u.success ? "updated" : "FAILED"} ${esc(u.tool)}`).join("<br>") : esc(d.updates.join(", "));
          const cleaned = done ? (d.clean_result ? `freed ${size(d.clean_result.freed_kib)}` : "—") : (d.reclaimable_folders ? `${d.reclaimable_folders} folder(s), ${size(d.reclaimable_kib)}` : "—");
          return `<tr><td>${esc(d.device)}</td><td>${pill(d.health.status)}<br><span class="muted">${esc(d.health.detail)}</span></td><td>${updates || "—"}</td><td>${cleaned}</td><td class="detail">${esc(d.held.join("; "))}</td></tr>`;
        }).join("")}</tbody></table></div>`;
    }

    function renderAgents(d) {
      const canChange = state.caps?.actions_enabled;
      if (d.status !== "ok") {
        $("view").innerHTML = `<div class="empty">${esc(d.device)}: ${esc(d.status)} (${esc(d.detail)})</div>`;
        return;
      }
      const dis = canChange ? "" : "disabled";
      const button = (kind, label, cls = "") => `<button class="${cls}" data-agents="${kind}" data-device="${esc(d.device)}" type="button" ${dis}>${label}</button>`;
      const running = d.server === "active";
      const claude = d.claude ? `${esc(d.claude_version || "installed")} ${pill(d.logged_in ? "logged in" : "not logged in")}` : pill("missing");
      const server = running
        ? `${pill("active")} in ${esc(d.server_dir || "?")}${d.sessions ? `, ${esc(d.sessions)} sessions in use` : ""}`
        : d.server === "absent" ? `${pill("off")} not set up` : pill(d.server);
      const browser = d.browser ? `${pill("on")} each session gets its own private headless browser${d.browser_installed ? "" : " (browser not downloaded yet)"}` : pill("off");
      const t3 = d.t3code ? `${pill(d.t3code)}${d.t3code_url ? ` at <a href="${esc(d.t3code_url)}" target="_blank" rel="noopener">${esc(d.t3code_url)}</a>` : ""}` : "—";
      $("view").innerHTML = `<div class="panel"><p>Claude sessions that live on ${esc(d.device)} and that you open from the Code tab in the Claude app or claude.ai/code, several at once. The files and tools stay on ${esc(d.device)}.</p></div>` +
        `<div class="scroll"><table><tbody>` +
        `<tr><th>Claude Code</th><td>${claude}</td><td></td></tr>` +
        `<tr><th>Remote Control</th><td>${server}</td><td>${running ? button("agents-stop", "Stop…", "danger") : button("agents-start", "Start…")}</td></tr>` +
        `<tr><th>Agent browser</th><td>${browser}</td><td>${d.browser ? button("agents-browser-off", "Turn off…", "danger") : button("agents-browser-on", "Turn on…")}</td></tr>` +
        `<tr><th>T3 Code</th><td>${t3}</td><td></td></tr>` +
        `</tbody></table></div>` +
        (d.next?.length ? `<div class="panel"><p><b>Next</b></p><ul>${d.next.map((step) => `<li>${esc(step)}</li>`).join("")}</ul></div>` : "");
    }

    function renderTools(data) {
      const text = filterText();
      const canChange = state.caps?.actions_enabled;
      $("view").innerHTML = data.devices.map((d) => {
        if (d.status !== "ok") return `<div class="card" style="margin-bottom:8px"><strong>${esc(d.device)} ${pill(d.status === "offline" ? "offline" : "error")}</strong><span>${esc(d.detail)}</span></div>`;
        const rows = d.tools.filter((t) => t.state !== "not-installed" && (!text || t.name.includes(text)));
        return `<h3>${esc(d.device)} <span class="muted">${esc(d.detail)}</span></h3><div class="scroll" style="margin-bottom:16px"><table><thead><tr><th>Tool</th><th>State</th><th>Running</th><th>Autostart</th><th>Detail</th><th></th></tr></thead><tbody>${rows.map((t) => {
          const update = t.state === "outdated" && t.updatable ? `<button data-tool="${esc(t.name)}" data-device="${esc(d.device)}" type="button" ${canChange ? "" : "disabled"}>Update</button>` : "";
          const dirty = t.uncommitted_changes ? `<br><span class="muted">${t.uncommitted_changes} uncommitted change(s) in the checkout would be built in</span>` : "";
          return `<tr><td>${esc(t.name)}</td><td>${pill(t.state === "current" ? "same" : t.state === "outdated" ? "behind" : t.state)}</td><td>${t.running ? "yes" : "—"}</td><td>${t.autostart ? "yes" : "—"}</td><td class="detail">${esc(t.updatable || t.state !== "outdated" ? t.detail : t.detail + "; deployed by Plugroot")}${dirty}</td><td>${update}</td></tr>`;
        }).join("")}</tbody></table></div>`;
      }).join("") + `<p class="muted">Tools are built from each device's own checkout in ~/Documents/github; the previous install is kept as a backup and a running tool is restarted (<code>lmice tools update NAME --device DEVICE</code>).</p>`;
    }

    function renderIntegrations(data) {
      const text = filterText();
      const canChange = state.caps?.actions_enabled;
      $("view").innerHTML = data.devices.map((d) => {
        if (!d.report) return `<div class="card" style="margin-bottom:8px"><strong>${esc(d.device)} ${pill(d.status)}</strong><span>${esc(d.detail)}</span></div>`;
        const rows = d.report.integrations.filter((i) => !text || `${i.id} ${i.display_name}`.toLowerCase().includes(text));
        return `<h3>${esc(d.device)}</h3><div class="scroll" style="margin-bottom:16px"><table><thead><tr><th>Integration</th><th>State</th><th>Used for</th><th>Detail</th><th></th></tr></thead><tbody>${rows.map((i) => {
          const toggle = i.state === "not-installed" ? "" : i.state === "disabled"
            ? `<button data-integration="enable" data-id="${esc(i.id)}" data-device="${esc(d.device)}" type="button" ${canChange ? "" : "disabled"}>Turn on</button>`
            : `<button data-integration="disable" data-id="${esc(i.id)}" data-device="${esc(d.device)}" type="button" ${canChange ? "" : "disabled"}>Turn off</button>`;
          return `<tr><td>${esc(i.display_name)}</td><td>${pill(i.state)}${i.configured ? "" : ` <span class="muted">not set up</span>`}</td><td class="detail">${esc(i.purpose)}</td><td class="detail">${esc(i.state === "active" ? i.detail : `${i.detail} → ${i.hint}`)}</td><td>${toggle}</td></tr>`;
        }).join("")}</tbody></table></div>`;
      }).join("") + `<p class="muted">Integrations are optional; turning one off only stops LinuxMice from using it on that device (<code>lmice integrations disable ID --device DEVICE</code>).</p>`;
    }

    function renderSelfhost(data) {
      const text = filterText();
      const services = data.services.filter((s) => !text || `${s.id} ${s.name}`.toLowerCase().includes(text));
      const checks = data.checks.filter((c) => c.severity !== "ok");
      $("cards").innerHTML = `<div class="card"><strong>${esc(data.device)} ${pill(data.status)}</strong><span>${esc(data.detail)}</span></div>`;
      $("view").innerHTML = (services.length ? `<div class="scroll"><table><thead><tr><th>Service</th><th>State</th><th>Kind</th><th>Ports</th><th>Detail</th></tr></thead><tbody>${services.map((s) => `<tr><td>${s.url ? `<a href="${esc(s.url)}">${esc(s.name || s.id)}</a>` : esc(s.name || s.id)}${s.optional ? ` <span class="muted">optional</span>` : ""}</td><td>${pill(s.state)}</td><td>${esc(s.kind)}</td><td class="detail">${esc(s.ports.join(", "))}</td><td class="detail">${esc(s.detail)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">No Plugroot services on this device. Pick a server above.</div>`) +
        (checks.length ? `<h3>Plugroot doctor</h3><div class="scroll"><table><tbody>${checks.map((c) => `<tr><td>${pill(c.severity)}</td><td>${esc(c.check)}</td><td class="detail">${esc(c.message)}</td></tr>`).join("")}</tbody></table></div>` : "") +
        `<p class="muted">Plugroot owns these services; manage them with <code>plugroot</code> on the device.</p>`;
    }

    function renderRescue(data) {
      $("cards").innerHTML = `<div class="card"><strong>${esc(state.caps?.device || "this node")} ${pill(data.summary.state)}</strong><span>${data.summary.ok} ok · ${data.summary.warnings} warnings · ${data.summary.critical} critical · ${data.summary.unknown} unknown</span></div>`;
      const group = (title, checks) => `<h3>${esc(title)}</h3><div class="scroll"><table><tbody>${checks.map((c) => `<tr><td>${pill(c.state)}</td><td>${esc(c.label)}</td><td class="detail">${esc(c.detail)}</td></tr>`).join("")}</tbody></table></div>`;
      const s = data.source_survival;
      $("view").innerHTML = group("Access routes", data.access_routes) + group("Critical services", data.critical_services) + group("Backups", data.backups) +
        `<h3>Source survival</h3><p>${pill(s.state)} ${s.total_repositories} repos · ${s.cloud_remote_repositories} on a cloud remote · ${s.local_or_forge_repositories} local/forge only · ${s.repositories_without_remotes} without a remote</p>` +
        (data.recommendations.length ? `<h3>Recommendations</h3><ul>${data.recommendations.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "") +
        `<p class="muted">Health covers the node this page runs on (${esc(state.caps?.device || "")}). Its checks assume a Linux server with systemd; on macOS most of them read "unknown".</p>`;
    }

    function openDiff(location) {
      const devices = (state.views.map?.data?.devices || []).filter((d) => d.collected).map((d) => d.device);
      if (devices.length < 2) return;
      state.location = location;
      const local = state.views.map.data.local_device;
      const first = devices.includes(local) ? local : devices[0];
      const second = devices.find((d) => d !== first);
      $("diffA").innerHTML = devices.map((d) => `<option ${d === first ? "selected" : ""}>${esc(d)}</option>`).join("");
      $("diffB").innerHTML = devices.map((d) => `<option ${d === second ? "selected" : ""}>${esc(d)}</option>`).join("");
      $("diffPatch").checked = false;
      $("diffTitle").textContent = location;
      $("diffBody").innerHTML = "";
      $("diffDialog").showModal();
      runDiff();
    }
    async function runDiff() {
      const a = $("diffA").value, b = $("diffB").value;
      if (a === b) { $("diffBody").innerHTML = `<div class="empty">Pick two different devices.</div>`; return; }
      $("diffBody").innerHTML = `<div class="empty">comparing ${esc(a)} and ${esc(b)}…</div>`;
      try {
        const patch = $("diffPatch").checked ? "&patch=1" : "";
        const view = await api(`/v1/linuxmice/diff?location=${encodeURIComponent(state.location)}&a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}${patch}`);
        $("diffBody").innerHTML = `<div class="meta">${meta(view)}</div>` + (view.data ? renderDiff(view.data) : `<div class="empty">${esc(view.error || view.hint)}</div>`);
      } catch (error) {
        $("diffBody").innerHTML = `<div class="empty">failed: ${esc(error.message)}</div>`;
      }
    }
    function renderDiff(d) {
      let html = `<p>${pill(d.relation.code)} ${esc(d.relation.detail)}</p>`;
      if (d.repository) {
        html += d.repository.sides.map((s) => `<h3>${esc(s.device)}</h3>` + (!s.present ? `<p class="muted">not present</p>` :
          `<p class="mono">${esc(s.path || "")} · ${esc(s.branch || "detached")} ${esc((s.head || "").slice(0, 10))}${s.upstream ? ` · ${esc(s.upstream)} +${s.upstream_ahead}/-${s.upstream_behind}` : ""}</p>` +
          (s.commits_only_here?.length ? `<p><strong>${s.commits_only_here_count} commit(s) only here</strong></p><pre class="mono">${s.commits_only_here.map((c) => `${esc(c.id.slice(0, 10))} ${esc(c.subject)}`).join("\n")}</pre>` : "") +
          (s.dirty_files?.length ? `<p><strong>Uncommitted (${s.dirty_entries})</strong></p><pre class="mono">${s.dirty_files.map((f) => `${esc(f.status)} ${esc(f.path)}`).join("\n")}</pre>` : "") +
          (s.stashes?.length ? `<p><strong>Stashes</strong></p><pre class="mono">${s.stashes.map(esc).join("\n")}</pre>` : "") +
          (s.patch ? `<p><strong>Changes${s.patch_truncated ? " (truncated)" : ""}</strong></p><pre class="mono panel">${esc(s.patch)}</pre>` : "") +
          (s.patch_withheld?.length ? `<p class="muted">withheld (secrets): ${esc(s.patch_withheld.join(", "))}</p>` : "") +
          (s.probe_error ? `<p class="muted">${esc(s.probe_error)}</p>` : ""))).join("");
      }
      if (d.folder) {
        html += `<p class="muted">${d.folder.identical_count} identical, ${d.folder.differing_count} differing</p>`;
        html += d.folder.sides.map((s) => `<h3>${esc(s.device)}: ${s.only_here_count} only here</h3>` + (s.only_here?.length ? `<pre class="mono">${s.only_here.map((f) => `${esc(f.path)}  ${bytes(f.size)}`).join("\n")}</pre>` : "")).join("");
        if (d.folder.differing?.length) html += `<h3>Differing</h3><pre class="mono">${d.folder.differing.map((f) => `${esc(f.path)}  newer on ${esc(f.newer_on || "?")}`).join("\n")}</pre>`;
      }
      return html;
    }

    let pendingConfirm = null;
    function askConfirm(command, note, onYes) {
      $("confirmNode").textContent = state.caps?.device || "this node";
      $("confirmCommand").textContent = `$ ${command}`;
      $("confirmNote").textContent = note;
      pendingConfirm = onYes;
      $("confirmDialog").showModal();
    }
    $("confirmYes").addEventListener("click", () => { $("confirmDialog").close(); const run = pendingConfirm; pendingConfirm = null; if (run) run(); });
    $("confirmNo").addEventListener("click", () => { pendingConfirm = null; $("confirmDialog").close(); });

    $("tabs").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-tab]");
      if (!button) return;
      state.tab = button.dataset.tab;
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b === button));
      if (state.tab === "selfhost") fillHostDevices();
      load(false);
    });
    $("view").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-location]");
      if (row && row.dataset.location) { openDiff(row.dataset.location); return; }
      const plan = event.target.closest("button[data-plan]");
      if (plan) { runMoveJob(plan.dataset.plan); return; }
      const execute = event.target.closest("button[data-execute]");
      if (execute) {
        const m = state.move;
        const command = {
          "execute-sync": `lmice workspace sync ${m.a} ${m.b} --format json --execute`,
          "execute-switch": `lmice workspace switch ${m.b} --from ${m.a} --format json --execute`,
          "execute-carry": `lmice workspace carry ${m.a} --to ${m.b} --format json --execute`,
        }[execute.dataset.execute];
        const note = execute.dataset.execute === "execute-switch"
          ? `Nothing is deleted. Uncommitted work moves to ${m.b}; ${m.a}'s copy of each moved checkout is saved under refs/lmice/switched/ (git stash apply restores it).`
          : "Nothing is deleted; replaced files are archived first, and the result is checked again afterwards.";
        askConfirm(command, note, () => runMoveJob(execute.dataset.execute));
        return;
      }
      if (event.target.closest("button[data-upkeep]")) {
        askConfirm("lmice upkeep --yes --format json", "Updates outdated tools from clean checkouts and removes build output unused for 14 days on every device. Builds can take several minutes.", async () => {
          $("meta").textContent = "running upkeep on every device (builds can take several minutes)…";
          try {
            const job = await startJob({ kind: "execute-upkeep" });
            state.views.upkeep = job.view;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          render();
        });
        return;
      }
      const agents = event.target.closest("button[data-agents]");
      if (agents) {
        const { agents: kind, device } = agents.dataset;
        const words = { "agents-start": "start", "agents-stop": "stop", "agents-browser-on": "browser on", "agents-browser-off": "browser off" }[kind];
        const notes = {
          "agents-start": "Keeps Claude Code Remote Control running as a user service; sessions you open from the Claude app or claude.ai/code run there.",
          "agents-stop": "Stops the Remote Control service; open sessions end.",
          "agents-browser-on": "Registers a private headless browser for every new Claude session (downloads a browser, about 400 MB on disk, once).",
          "agents-browser-off": "New Claude sessions start without the agent browser.",
        };
        askConfirm(`lmice agents ${words} --device ${device} --yes --format json`, notes[kind], async () => {
          $("meta").textContent = `agents ${words} on ${device}…`;
          try {
            const job = await startJob({ kind, device });
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `failed: ${job.view.data.output || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const tool = event.target.closest("button[data-tool]");
      if (tool) {
        const { tool: id, device } = tool.dataset;
        askConfirm(`lmice tools update ${id} --device ${device} --yes --format json`, "Builds from that device's checkout; the previous install is kept as a backup and the tool is restarted if it was running. This can take a few minutes.", async () => {
          $("meta").textContent = `updating ${id} on ${device}…`;
          try {
            const job = await startJob({ kind: "tool-update", id, device });
            if (job.view?.data && job.view.data.success === false) $("meta").textContent = `update failed: ${job.view.data.output || ""}`;
          } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
        return;
      }
      const toggle = event.target.closest("button[data-integration]");
      if (toggle) {
        const { integration, id, device } = toggle.dataset;
        askConfirm(`lmice integrations ${integration} ${id} --device ${device} --format json`, "This only changes whether LinuxMice uses the tool on that device.", async () => {
          $("meta").textContent = "updating…";
          try { await startJob({ kind: `integration-${integration}`, id, device }); } catch (error) { $("meta").textContent = `failed: ${error.message}`; return; }
          load(true);
        });
      }
    });
    $("view").addEventListener("change", (event) => {
      if (event.target.id === "moveA") { state.move.a = event.target.value; state.move.result = null; renderMove(); }
      if (event.target.id === "moveB") { state.move.b = event.target.value; state.move.result = null; renderMove(); }
    });
    function fillHostDevices() {
      const devices = fleetDevices();
      const select = $("hostDevice");
      const current = state.selfhostDevice;
      select.innerHTML = `<option value="">${esc(state.caps?.device || "this node")} (this node)</option>` + devices.filter((d) => d !== state.caps?.device).map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
      select.value = current;
    }
    $("hostDevice").addEventListener("change", () => { state.selfhostDevice = $("hostDevice").value; load(false); });
    $("search").addEventListener("input", render);
    $("verdict").addEventListener("change", render);
    $("refresh").addEventListener("click", () => { if (state.tab === "move") { state.move.result = null; } if (state.tab === "devices") { state.views.health = null; } load(true); });
    $("diffRun").addEventListener("click", runDiff);
    $("diffPatch").addEventListener("change", runDiff);
    $("diffClose").addEventListener("click", () => $("diffDialog").close());

    (async () => {
      try { state.caps = await api("/v1/linuxmice/capabilities"); } catch (_) { state.caps = null; }
      api("/v1/linuxmice/devices").then((view) => { state.views.devices = view; }).catch(() => {});
      load(false);
    })();
  </script>
</body>
</html>
